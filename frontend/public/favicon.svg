  <circle class="b" cx="20" cy="16" r="8.5" fill="none" stroke-width="2.4" />
  <path class="f" d="M16 8.5A8.5 8.5 0 0 1 16 23.5A8.5 8.5 0 0 1 16 8.5Z" />
