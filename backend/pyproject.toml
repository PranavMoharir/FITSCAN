[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitscan-backend"
version = "0.1.0"
description = "Job–Candidate Matching Platform: FastAPI API and Celery worker"
requires-python = ">=3.12"
# Runtime dependencies of both images (HLD §7.5). PDF, OCR and TF-IDF libraries are worker-only (below).
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.7",
    "psycopg[binary]==3.3.7",
    "alembic==1.20.1",
    "celery[redis]==5.6.3",
    "redis==8.1.0",
    "httpx==0.28.1",  # crawler HTTP client (and FastAPI's TestClient)
    "beautifulsoup4==4.15.0",  # HTML parsing in the extractors
    "python-multipart==0.0.33",  # multipart/form-data parsing for resume uploads (FastAPI)
    "email-validator==2.3.0",  # Pydantic EmailStr in CandidateRecord
]

[project.optional-dependencies]
# Worker-only libraries; the worker image installs them (with Chromium and Tesseract).
# The API image has none of them: it only checks the %PDF- signature and the size of uploads.
worker = [
    "playwright==1.64.1",  # headless Chromium, only for pages that need JavaScript
    "pymupdf==1.28.2",  # open PDFs, text blocks with coordinates and font sizes, page rendering for OCR (2.x adds an unused ML layout model)
    "pdfplumber==0.11.10",  # tables, and word extraction when PyMuPDF's text looks garbled
    "pytesseract==0.3.13",  # calls the Tesseract binary (installed in the worker image)
    "pillow==13.0.0",  # images passed to Tesseract
    "scikit-learn==1.9.1",  # TF-IDF text similarity: the tie-breaker of equal match scores, never part of the score
    # scikit-learn's own dependencies, pinned as well, so every fresh worker build gets the same versions
    "numpy==2.5.4",
    "scipy==1.18.1",
    "joblib==1.6.0",
    "threadpoolctl==3.8.0",
    "narwhals==2.28.0",
    "cloudpickle==3.1.2",  # needed by joblib
]
# Test tools: pip install -e ".[dev]"
dev = [
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
