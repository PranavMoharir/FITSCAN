# Starts every service with:  docker compose up --build   (HLD §16)
# Configuration comes from .env (copy .env.example first).
#
# Only the frontend (5173) and the API (8000) are published to the host. db and redis
# stay inside the Compose network; services reach each other by service name.

name: fitscan

x-backend-environment: &backend-environment
  # Container-specific values. They override the host-development values in .env.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: api
    env_file: .env
    environment: *backend-environment
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Healthy only when GET /health returns 200 (database and Redis both reachable).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    # Two worker processes instead of one per CPU: each process can start its own Chromium,
    # and crawls mostly wait on the network and the per-domain rate limit anyway.
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    environment: *backend-environment
    volumes:
      - uploads:/data/uploads:ro   # the API writes uploads, the worker only reads them
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy   # the API has applied the migrations, so the schema exists
    restart: unless-stopped

  mock-site:
    # Optional demo job site (ADR-024): static pages and one JavaScript-rendered page, with its
    # own robots.txt. Reachable inside the Compose network as http://mock-site:8080/.
    # Not published to the host; CRAWLER_PRIVATE_HOST_ALLOWLIST=mock-site lets the crawler reach it.
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8080", "--directory", "/site"]
    volumes:
      - ./mock-site:/site:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/robots.txt', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Vite reads these at build time; rebuild the image after changing them.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-2000}
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
