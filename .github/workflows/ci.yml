# Continuous integration: the backend test suite and the frontend production build (README "Tests").
#
# Nothing here reaches a real database, Redis, job site or browser. The backend job gets its own
# throwaway PostgreSQL service whose only database is matching_test; the integration tests drop and
# recreate that schema, and refuse to run against any other database.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12, PostgreSQL 17, Tesseract)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine  # the same image as docker-compose.yml
        env:
          POSTGRES_DB: matching_test  # the only database the integration tests accept
          POSTGRES_USER: fitscan
          POSTGRES_HOST_AUTH_METHOD: trust  # a throwaway service reachable only from this job: no password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitscan -d matching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both name matching_test: tests/conftest.py replaces any other DATABASE_URL with an offline placeholder.
      TEST_DATABASE_URL: postgresql+psycopg://fitscan@127.0.0.1:5432/matching_test
      DATABASE_URL: postgresql+psycopg://fitscan@127.0.0.1:5432/matching_test
      # The tests replace Celery publishing; this host does not resolve, so nothing can reach a broker.
      REDIS_URL: redis://redis.invalid:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Tesseract OCR (as in the worker image)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Install the backend with its worker and test dependencies
        run: pip install -e ".[worker,dev]"

      - name: Confirm the test database is matching_test
        run: |
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = os.environ["TEST_DATABASE_URL"]
          assert make_url(url).database == "matching_test", "TEST_DATABASE_URL must name matching_test"
          with create_engine(url).connect() as connection:
              active = connection.execute(text("SELECT current_database()")).scalar_one()
          print(f"current_database() = {active}")
          assert active == "matching_test", f"connected to {active!r}, not matching_test"
          EOF

      - name: Run the backend tests (none may be skipped)
        shell: bash
        run: |
          python -m pytest -q 2>&1 | tee pytest-output.txt
          # Database and OCR tests skip themselves when their service is missing; here both must run.
          if grep -Eq "[0-9]+ skipped" pytest-output.txt; then
            echo "::error::Some tests were skipped. In CI the database and OCR tests must run."
            exit 1
          fi

  frontend:
    name: Frontend build (Node 24, TypeScript check)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the exact locked dependencies
        run: npm ci

      - name: Type-check and build for production
        run: npm run build  # tsc -b && vite build

      - name: Check the sidebar's link classes (full and collapsed)
        run: npm run check:sidebar
